# Render Blueprint — deploy backend (FastAPI) เป็น Web Service
# ใช้: Render Dashboard → Blueprint / หรือ render.yaml auto-deploy จาก GitHub
# หมายเหตุ: Render free tier ไม่มี persistent disk → ต้องตั้ง S3/R2 สำหรับ upload รูป
#
# ⚠ สำคัญ: ค่าที่เป็น `sync: false` = "ตั้งใน Dashboard เท่านั้น ห้าม sync จากไฟล์"
#    ห้ามใส่ค่าจริงของ DATABASE_URL / CORS_ORIGINS / REPORT_FORM_URL ในไฟล์นี้
#    เพราะ Render จะเขียนทับค่าที่ตั้งไว้ใน production (เคยทำให้ DATABASE_URL
#    ชี้ไปฐานข้อมูลของ Render แทน Neon แล้วระบบอ่านข้อมูลไม่ได้)
services:
  - type: web
    name: smart-classroom-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # Pin Python 3.11 — โค้ดทดสอบบน 3.11 และ Pillow 12.3.0 (ใน requirements.txt) มี wheel cp311
      # Pillow 12.x ต้องการ Python >= 3.10 — ถ้าจะเลื่อนเวอร์ชัน Python ให้เช็ค wheel ก่อนทุกครั้ง
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: "production"
      - key: GEMINI_MODEL
        value: "gemini-flash-latest"
      # ── ค่าต่อไปนี้ต้องตั้งใน Render Dashboard (มีค่าจริงอยู่แล้ว ห้าม sync) ──
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: CORS_ORIGINS          # โดเมน frontend บน Vercel
        sync: false
      - key: REPORT_FORM_URL       # ลิงก์ฟอร์มแจ้งซ่อมสาธารณะ
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: N8N_SHARED_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_TOKEN
        sync: false
      - key: LINE_GROUP_ID
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: STORAGE_BACKEND
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: UPLOAD_URL_SECRET
        sync: false

# หมายเหตุ: บล็อก databases ด้านล่างไม่ได้ใช้งานแล้ว (ระบบใช้ Neon เป็นฐานข้อมูลจริง)
# เก็บไว้เพื่อไม่ให้ Render ลบฐานข้อมูลเดิมทิ้ง — ถ้าต้องการลบจริงให้ลบทั้งบล็อกนี้
databases:
  - name: smart-classroom-db
    plan: free
