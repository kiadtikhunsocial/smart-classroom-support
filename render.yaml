# Render Blueprint — deploy backend (FastAPI) เป็น Web Service
# ใช้: Render Dashboard → Blueprint / หรือ render.yaml auto-deploy จาก GitHub
# หมายเหตุ: Render free tier ไม่มี persistent disk → ต้องตั้ง S3/Cloudinary สำหรับ upload รูป
services:
  - type: web
    name: smart-classroom-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # Pin Python 3.11 (Pillow 10.2.0 + code tested on 3.11; 3.14 build ของ Pillow เก่าพัง)
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-classroom-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://smart-classroom.vercel.app"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-flash-latest"
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_TOKEN
        sync: false
      - key: LINE_GROUP_ID
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: REPORT_FORM_URL
        value: "https://smart-classroom.vercel.app/?publicreport=1"

databases:
  - name: smart-classroom-db
    plan: free
