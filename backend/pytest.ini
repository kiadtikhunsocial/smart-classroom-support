[pytest]
# ชุดเทสต์อัตโนมัติทั้งหมดอยู่ใน backend/tests/ (รันจากโฟลเดอร์ backend: python -m pytest -q)
#   - backend/conftest.py        ตั้ง env ให้ทุกเทสต์ก่อน import app (เช่น N8N_SHARED_SECRET, AUTO_ASSIGN_ENABLED=0)
#   - backend/tests/conftest.py  fixture ที่ใช้ร่วมกัน (client, admin_headers, ticket_world, ...)
# เทสต์หลายไฟล์เขียนลง PostgreSQL ตาม DATABASE_URL จริง ให้ชี้ไปฐานข้อมูลในเครื่องเท่านั้น
# ห้ามชี้ไป production (Supabase)
#
# backend/scripts/smoke_*.py เป็นสคริปต์ทดสอบด้วยมือ ไม่ใช่ pytest: assert ตอน import,
# ล็อกอินกับฐานข้อมูลจริงและแก้ข้อมูลจริง จึงตั้งชื่อ smoke_ (ไม่ใช่ test_) และไม่อยู่ใน testpaths
testpaths = tests
norecursedirs = scripts .venv venv __pycache__ .git .pytest_cache uploads static
