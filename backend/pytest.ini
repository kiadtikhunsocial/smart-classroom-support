[pytest]
# Collect only the automated test suite that lives at the backend root
# (test_chatbot_guardrails.py, test_chatbot_prompt.py, test_ticket_creation.py, ...).
#
# backend/scripts/test_*.py are MANUAL smoke scripts, not pytest tests: they run
# their assertions at import time, log in against the live database and mutate
# real rows. pytest imports every test_*.py during collection, so those scripts
# aborted the whole run with KeyError: 'token' / TypeError before any real test
# executed. They remain runnable by hand, e.g.:
#     .venv/Scripts/python.exe scripts/test_kb_perms.py
testpaths = .
norecursedirs = scripts .venv venv __pycache__ .git .pytest_cache uploads static