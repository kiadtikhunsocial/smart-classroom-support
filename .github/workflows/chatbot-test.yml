name: Manual legacy Railway chatbot smoke test

on:
  workflow_dispatch:

jobs:
  chatbot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run chatbot flow tests against Railway backend
        env:
          # ชี้ไป backend ที่ deploy แล้ว — เปลี่ยนเป็น URL จริงของ Railway backend
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::BACKEND_URL secret not set — using default Railway backend"
            export BACKEND_URL="https://backend-production-728f.up.railway.app/api/line/bot"
          fi
          echo "Testing against: $BACKEND_URL"
          python scripts/test_chatbot_flow.py
